<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>WildVision - 2D Tile Layout Simulator</title>
  </head>
  <body>
    <div id="root">
      <style>
        .wv-loader-container {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          width: 100vw;
          background-color: #020617; /* Tailwind slate-950 */
          color: #f8fafc; /* Tailwind slate-50 */
          font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
          margin: 0;
          position: fixed;
          top: 0;
          left: 0;
          z-index: 9999;
        }
        .wv-spinner {
          width: 48px;
          height: 48px;
          border: 3px solid rgba(255, 255, 255, 0.1);
          border-left-color: #38bdf8; /* Tailwind sky-400 */
          border-radius: 50%;
          animation: wv-spin 1s linear infinite;
          margin-bottom: 24px;
        }
        .wv-title {
          font-size: 20px;
          font-weight: 600;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          animation: wv-pulse 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes wv-spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        @keyframes wv-pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.5; }
        }
      </style>
      <div class="wv-loader-container">
        <div class="wv-spinner"></div>
        <div class="wv-title">WildVision</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
